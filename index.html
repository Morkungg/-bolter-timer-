<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOLTER LOOP HELPER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #070b09;
    --bg-grid: #0d1310;
    --panel: #0f1613;
    --panel-2: #131c18;
    --line: #223028;
    --text: #dff2e8;
    --muted: #6f8579;
    --muted-2: #4a5a51;

    --p1: #3fd6c8;
    --p1-glow: rgba(63,214,200,0.35);
    --p2: #f5a623;
    --p2-glow: rgba(245,166,35,0.35);
    --alert: #ffe14d;
    --alert-2: #ff4d4d;

    --font-display: 'Chakra Petch', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height:100vh;
  }

  body{
    background-image:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: center;
  }

  .scanline-overlay{
    position: fixed; inset:0; pointer-events:none; z-index: 50;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,20,10,0.035) 3px,
      rgba(0,20,10,0.035) 4px
    );
    mix-blend-mode: multiply;
  }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top{
    display:flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
  }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--p1);
    text-transform: uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:7px; height:7px;
    background: var(--p1);
    border-radius:50%;
    box-shadow: 0 0 8px var(--p1);
    animation: pulseDot 2s infinite ease-in-out;
  }
  @keyframes pulseDot{
    0%,100%{ opacity:1; }
    50%{ opacity: .35; }
  }

  h1{
    margin:0;
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    letter-spacing: 1px;
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  h1 .accent{ color: var(--p1); }
  .subtitle{
    color: var(--muted);
    font-size: 13px;
    font-family: var(--font-mono);
    max-width: 640px;
    line-height:1.6;
  }

  .add-bar{
    display:flex;
    gap:10px;
    margin-bottom: 26px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px;
    border-radius: 6px;
  }
  .add-bar input[type="text"]{
    flex: 1 1 250px;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 4px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .add-bar input[type="text"]::placeholder{ color: var(--muted-2); }
  .add-bar input[type="text"]:focus{
    border-color: var(--p1);
    box-shadow: 0 0 0 3px var(--p1-glow);
  }

  .duration-field{
    display:flex;
    align-items:center;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 10px;
    flex: 0 0 auto;
  }
  .duration-field label{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .5px;
    color: var(--muted);
    white-space: nowrap;
  }
  .duration-field input[type="number"]{
    width: 40px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    text-align:center;
    padding: 12px 2px;
    outline: none;
    -moz-appearance: textfield;
  }
  .duration-field input[type="number"]::-webkit-outer-spin-button,
  .duration-field input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance: none; margin:0;
  }
  .duration-field input[type="number"]:focus{ border-bottom-color: var(--p1); }
  .duration-field .colon{ color: var(--muted-2); font-family: var(--font-mono); font-size: 13px; }

  .duration-row{
    display:flex;
    align-items:center;
    gap: 6px;
    margin-top: 4px;
  }
  .duration-row .btn-icon{
    width: 20px; height: 20px;
    font-size: 10px;
  }
  .duration-edit-inline{
    display:flex;
    align-items:center;
    gap: 4px;
  }
  .duration-edit-inline input[type="number"]{
    width: 32px;
    background: var(--bg);
    border: 1px solid var(--p1);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 11px;
    text-align:center;
    padding: 2px 1px;
    border-radius: 3px;
    outline: none;
    -moz-appearance: textfield;
  }
  .duration-edit-inline input[type="number"]::-webkit-outer-spin-button,
  .duration-edit-inline input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance: none; margin:0;
  }
  .duration-edit-inline .colon{ color: var(--muted-2); font-size: 11px; }

  .btn-add{
    background: var(--p1);
    color: #06110e;
    border: none;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 13px 22px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform .12s, filter .12s;
    white-space: nowrap;
  }
  .btn-add:hover{ filter: brightness(1.12); }
  .btn-add:active{ transform: scale(.97); }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .empty-state{
    grid-column: 1 / -1;
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 50px 20px;
    text-align:center;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state .big{
    font-family: var(--font-display);
    color: var(--muted);
    font-size: 18px;
    display:block;
    margin-bottom:6px;
  }

  .card{
    position: relative;
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px 20px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
    transition: box-shadow .3s, border-color .3s, background .3s;
  }

  .card::before, .card::after,
  .corner-br, .corner-bl{
    content:"";
    position:absolute;
    width: 16px; height: 16px;
    border: 2px solid var(--muted-2);
    transition: border-color .3s;
  }
  .card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card::after{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .corner-bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; }
  .corner-br{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  .card[data-state="phase1"]{ border-color: rgba(63,214,200,0.35); }
  .card[data-state="phase1"]::before, .card[data-state="phase1"]::after,
  .card[data-state="phase1"] .corner-bl, .card[data-state="phase1"] .corner-br{ border-color: var(--p1); }

  .card[data-state="phase2"]{ border-color: rgba(245,166,35,0.35); }
  .card[data-state="phase2"]::before, .card[data-state="phase2"]::after,
  .card[data-state="phase2"] .corner-bl, .card[data-state="phase2"] .corner-br{ border-color: var(--p2); }

  .card.alerting{
    animation: alertBg 0.9s infinite;
  }
  @keyframes alertBg{
    0%,100%{ box-shadow: 0 0 0 rgba(255,225,77,0); background: linear-gradient(160deg, var(--panel-2), var(--panel)); }
    50%{ box-shadow: 0 0 26px 4px rgba(255,225,77,0.55); background: linear-gradient(160deg, #2a250f, #1a1710); }
  }
  .card.alerting::before, .card.alerting::after,
  .card.alerting .corner-bl, .card.alerting .corner-br{
    animation: alertCorner .9s infinite;
  }
  @keyframes alertCorner{
    0%,100%{ border-color: var(--alert); }
    50%{ border-color: var(--alert-2); }
  }

  .card-top{
    width:100%;
    display:flex;
    justify-content: space-between;
    align-items:flex-start;
    gap: 8px;
  }

  .point-name{
    font-weight: 600;
    font-size: 16px;
    letter-spacing: .5px;
    word-break: break-word;
    line-height:1.3;
  }
  .point-config {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--font-mono);
    margin-top: 4px;
    display:flex;
    align-items:center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .mini-edit, .mini-confirm{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    width: 18px; height: 18px;
    border-radius: 3px;
    cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    font-size: 10px;
    line-height:1;
    padding:0;
    flex-shrink:0;
  }
  .mini-edit:hover{ border-color: var(--p1); color: var(--p1); }
  .mini-confirm{ border-color: var(--p1); color: var(--p1); }
  .mini-confirm:hover{ background: var(--p1-glow); }
  .dur-input{
    width: 30px;
    background: var(--bg);
    border: 1px solid var(--p1);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 11px;
    text-align:center;
    padding: 2px 0;
    border-radius: 3px;
    outline:none;
    -moz-appearance: textfield;
  }
  .dur-input::-webkit-outer-spin-button,
  .dur-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

  .card-top-actions{
    display:flex;
    gap: 6px;
    flex-shrink:0;
  }

  .btn-icon{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    width: 28px; height: 28px;
    border-radius: 4px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    transition: border-color .15s, color .15s;
    font-size: 13px;
    line-height:1;
    padding:0;
    text-decoration: none;
  }
  .btn-icon.btn-edit:hover{ border-color: var(--p1); color: var(--p1); }
  .btn-icon.btn-del:hover{ border-color: var(--alert-2); color: var(--alert-2); }

  /* ช่องรูปภาพประจำการ์ด */
  .card-image-box {
    width: 100%;
    height: 120px;
    border: 1px dashed var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: var(--bg);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s;
  }
  .card-image-box:hover {
    border-color: var(--p1);
  }
  .card-image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
    transition: transform .2s;
  }
  .card-image-box img:hover {
    transform: scale(1.03);
  }
  .upload-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    width: 100%;
    height: 100%;
    justify-content: center;
    background: rgba(255,255,255,0.01);
    transition: color .15s, background .15s;
  }
  .upload-label:hover {
    color: var(--p1);
    background: rgba(63,214,200,0.03);
  }
  .upload-label input {
    display: none;
  }

  .card-image-box.has-image{
    border-style: solid;
  }

  .card-image-box.has-image::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    box-shadow: inset 0 0 0 1px rgba(63,214,200,0.06);
  }

  .image-loading-text{
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .image-change-btn{
    position:absolute;
    top:6px;
    right:6px;
    z-index:2;
    background:rgba(0,0,0,0.78);
    border-color:var(--line);
    width:28px;
    height:28px;
    font-size:12px;
  }

  .image-change-btn:hover{
    border-color:var(--p1);
    color:var(--p1);
  }

  .card-image-box .card-file-input{
    display:none;
  }

  .name-edit-input{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--p1);
    color: var(--text);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .5px;
    padding: 4px 8px;
    border-radius: 4px;
    outline: none;
    box-shadow: 0 0 0 3px var(--p1-glow);
  }

  .ring-wrap{
    position: relative;
    width: 160px; height: 160px;
    display:flex; align-items:center; justify-content:center;
  }
  svg.ring{ transform: rotate(-90deg); width:160px; height:160px; }
  .ring-track{ fill:none; stroke: var(--line); stroke-width: 8; }
  .ring-progress{
    fill:none;
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s linear, stroke .3s;
  }

  .ring-center{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 3px;
  }
  .digits{
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .phase-label{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 1.2px;
    color: var(--muted);
    text-transform: uppercase;
    text-align:center;
    max-width: 120px;
  }

  .status-line{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .5px;
    text-align:center;
    min-height: 15px;
    color: var(--muted);
  }
  .card[data-state="phase1"] .status-line{ color: var(--p1); }
  .card[data-state="phase2"] .status-line{ color: var(--p2); }
  .card.alerting .status-line{ color: var(--alert); font-weight:700; }

  .card-actions{
    width:100%;
    display:flex;
    flex-direction: column;
    gap: 8px;
  }

  .time-adjust-bar {
    display: flex;
    gap: 5px;
    width: 100%;
  }
  .btn-adj {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    padding: 8px 0;
    border-radius: 4px;
    cursor: pointer;
    transition: all .15s;
    flex: 1;
    text-align: center;
  }
  .btn-adj:hover {
    border-color: var(--p2);
    color: var(--p2);
    background: rgba(245,166,35,0.08);
  }
  .btn-adj:active {
    transform: scale(0.95);
  }

  .btn{
    flex: 1;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 11px 10px;
    border-radius: 4px;
    cursor: pointer;
    border: none;
    transition: transform .12s, filter .12s;
    text-align: center;
  }
  .btn:active{ transform: scale(.96); }

  .btn-start{
    background: var(--p1);
    color: #06110e;
    width: 100%;
  }
  .btn-start:hover{ filter: brightness(1.12); }

  .btn-reset{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .btn-reset:hover{ border-color: var(--alert-2); color: var(--alert-2); }

  /* Modal สำหรับดูรูปขยายใหญ่ */
  .modal-overlay {
    position: fixed; inset:0; background: rgba(0,0,0,0.85);
    z-index: 100; display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .modal-header {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-mono); font-size: 14px;
  }
  .modal-body { padding: 10px; display: flex; justify-content: center; align-items: center; overflow: auto; }
  .modal-body img { max-width: 100%; max-height: 75vh; border-radius: 4px; object-fit: contain; }

  footer{
    margin-top: 50px;
    text-align:center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted-2);
    letter-spacing: 1px;
  }

  /* Toast pop-up notifications, top-right */
  .toast-container{
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 200;
    display:flex;
    flex-direction: column;
    gap: 10px;
    max-width: min(320px, calc(100vw - 36px));
    pointer-events: none;
  }
  .toast{
    pointer-events: auto;
    background: linear-gradient(160deg, var(--panel-2), var(--panel));
    border: 1px solid var(--alert);
    border-left: 4px solid var(--alert);
    border-radius: 6px;
    padding: 12px 12px 12px 14px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45), 0 0 18px rgba(255,225,77,0.18);
    display:flex;
    align-items:flex-start;
    gap: 10px;
    animation: toastIn .3s ease-out;
  }
  .toast.leaving{ animation: toastOut .22s ease-in forwards; }
  @keyframes toastIn{
    from{ transform: translateX(120%); opacity:0; }
    to{ transform: translateX(0); opacity:1; }
  }
  @keyframes toastOut{
    from{ transform: translateX(0); opacity:1; }
    to{ transform: translateX(120%); opacity:0; }
  }
  .toast-icon{ font-size:18px; line-height:1; flex-shrink:0; margin-top:1px; }
  .toast-body{ flex:1; min-width:0; }
  .toast-title{
    font-family: var(--font-display);
    font-weight:700;
    font-size:13px;
    color: var(--alert);
    margin-bottom:2px;
  }
  .toast-msg{
    font-family: var(--font-mono);
    font-size:11.5px;
    color: var(--text);
    line-height:1.5;
    word-break: break-word;
  }
  .toast-close{
    background:transparent;
    border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:14px;
    line-height:1;
    flex-shrink:0;
    padding:2px;
  }
  .toast-close:hover{ color:var(--alert-2); }
</style>
</head>
<body>
<div class="scanline-overlay"></div>
<div class="toast-container" id="toastContainer"></div>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">FIVEM &middot; JOB TIMER UTILITY</div>
    <h1>BOLTER <span class="accent">LOOP</span> HELPER</h1>
    <div class="subtitle">
      ระบบจับเวลาวนลูปอัตโนมัติ เพิ่มชื่อจุดแล้วคลิกอัปโหลดรูปภาพได้โดยตรงบนการ์ด (รูปเก็บแยกต่างหาก รองรับได้หลายสิบรูป)
    </div>
  </header>

  <div class="add-bar">
    <input type="text" id="pointNameInput" placeholder="พิมพ์ชื่อจุด เช่น Bolter จุด 1..." maxlength="40" />
    <div class="duration-field">
      <label for="phase2MinInput">รอเกิด</label>
      <input type="number" id="phase2MinInput" min="0" max="59" value="8" />
      <span class="colon">:</span>
      <input type="number" id="phase2SecInput" min="0" max="59" value="30" />
    </div>
    <button class="btn-add" id="addPointBtn">+ เพิ่มจุด</button>
  </div>

  <div class="grid" id="pointsGrid"></div>

  <footer>BOLTER-TIMER &middot; ข้อมูลบันทึกในเครื่องนี้ (LocalStorage + IndexedDB)</footer>
</div>

<!-- Modal สำหรับแสดงรูปภาพขนาดใหญ่ -->
<div class="modal-overlay" id="imageModal">
  <div class="modal-content">
    <div class="modal-header">
      <span id="modalTitle">รูปภาพจุดจก</span>
      <button class="btn-icon btn-del" id="closeModalBtn">✕</button>
    </div>
    <div class="modal-body">
      <img id="modalImage" src="" alt="Point Image" />
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const PHASE1_DURATION = (5 * 60 + 30) * 1000;
  const PHASE2_DURATION = (8 * 60 + 30) * 1000;
  const ALERT_THRESHOLD = 30 * 1000;
  const STORAGE_KEY = "bolterLoopPoints_v15";

  const grid = document.getElementById("pointsGrid");
  const nameInput = document.getElementById("pointNameInput");
  const phase2MinInput = document.getElementById("phase2MinInput");
  const phase2SecInput = document.getElementById("phase2SecInput");
  const addBtn = document.getElementById("addPointBtn");
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");
  const modalTitle = document.getElementById("modalTitle");
  const closeModalBtn = document.getElementById("closeModalBtn");
  const toastContainer = document.getElementById("toastContainer");
  const DEFAULT_TITLE = document.title;

  let points = [];
  let editingId = null;

  // ---------- Image storage (IndexedDB, not localStorage) ----------
  // localStorage is capped around 5-10MB total. Images are kept in IndexedDB instead,
  // which comfortably holds dozens of compressed photos. Only a small "hasImage" flag
  // lives in the localStorage point record.
  const DB_NAME = "BolterLoopImagesDB";
  const DB_VERSION = 1;
  const STORE_NAME = "images";
  let dbPromise = null;
  const imageCache = new Map(); // in-memory cache: id -> dataURL, avoids re-reading IDB every render

  function getDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if(!("indexedDB" in window)){ reject(new Error("no indexeddb")); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if(!db.objectStoreNames.contains(STORE_NAME)){
          db.createObjectStore(STORE_NAME);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function idbSetImage(id, dataUrl){
    try{
      const db = await getDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(dataUrl, id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }catch(e){ return false; }
  }
  async function idbGetImage(id){
    try{
      const db = await getDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readonly");
        const req = tx.objectStore(STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }catch(e){ return null; }
  }
  async function idbDeleteImage(id){
    try{
      const db = await getDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }catch(e){ return false; }
  }

  // Resize + re-encode the photo before storing so 20+ images stay small and fast to load.
  function compressImage(file, maxDim, quality){
    maxDim = maxDim || 900;
    quality = quality || 0.82;
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        let width = img.width, height = img.height;
        if(width > maxDim || height > maxDim){
          if(width > height){
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function ensureNotifyPermission(){
    if("Notification" in window && Notification.permission === "default"){
      Notification.requestPermission();
    }
  }
  function notifyAlert(pointName){
    if(!("Notification" in window)) return;
    if(Notification.permission !== "granted") return;
    if(!document.hidden) return;
    try{
      new Notification("BOLTER LOOP HELPER", {
        body: `${pointName} — เหลือ 30 วินาที ไปรอจุดจกได้เลย!`,
        tag: "bolter-alert-" + pointName,
      });
    }catch(e){}
  }

  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }catch(e){}
    }else if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }
  }
  function beep(freq, duration, delay){
    if(!audioCtx) return;
    const t0 = audioCtx.currentTime + (delay||0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration/1000);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration/1000 + 0.02);
  }
  function playAlertPulse(){
    beep(880, 140, 0);
    beep(880, 140, 0.18);
  }

  // ---------- In-page toast pop-up (top-right) ----------
  function showToast(pointName){
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerHTML = `
      <div class="toast-icon">⚠️</div>
      <div class="toast-body">
        <div class="toast-title">ใกล้ถึงรอบแล้ว!</div>
        <div class="toast-msg">${escapeHtml(pointName)} — เหลือ 30 วินาที ไปรอจุดจกได้เลย</div>
      </div>
      <button class="toast-close" title="ปิด" aria-label="ปิดการแจ้งเตือน">✕</button>
    `;
    toastContainer.appendChild(toast);

    let removed = false;
    function removeToast(){
      if(removed) return;
      removed = true;
      toast.classList.add("leaving");
      setTimeout(() => toast.remove(), 220);
    }
    const timer = setTimeout(removeToast, 8000);
    toast.querySelector(".toast-close").addEventListener("click", () => {
      clearTimeout(timer);
      removeToast();
    });
  }

  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(points)); }catch(e){}
  }
  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) points = JSON.parse(raw);
    }catch(e){ points = []; }
    if(!Array.isArray(points)) points = [];
  }

  // One-time migration: older versions stored the image as raw base64 directly on
  // the point object (p.image). Move any of those into IndexedDB so nothing is lost.
  async function migrateOldInlineImages(){
    let didMigrate = false;
    for(const p of points){
      if(p.image){
        const ok = await idbSetImage(p.id, p.image);
        if(ok){
          imageCache.set(p.id, p.image);
          p.hasImage = true;
        }
        delete p.image;
        didMigrate = true;
      }
    }
    if(didMigrate) save();
  }

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function addPoint(name, phase2Duration){
    points.push({
      id: uid(),
      name: name,
      hasImage: false,
      phase2Duration: phase2Duration || PHASE2_DURATION,
      state: "idle",
      endTime: null,
      alertPlaying: false
    });
    save();
    render(true);
  }

  function deletePoint(id){
    points = points.filter(p => p.id !== id);
    if(editingId === id) editingId = null;
    imageCache.delete(id);
    idbDeleteImage(id);
    save();
    render(true);
  }

  async function updatePointImage(id, dataUrl){
    const p = points.find(x => x.id === id);
    if(!p) return;
    const ok = await idbSetImage(id, dataUrl);
    if(!ok){
      alert("บันทึกรูปไม่สำเร็จ ลองใหม่อีกครั้ง หรือเบราว์เซอร์นี้อาจไม่รองรับ IndexedDB");
      return;
    }
    imageCache.set(id, dataUrl);
    p.hasImage = true;
    save();
    render(true);
  }

  function startPoint(id){
    ensureAudio();
    ensureNotifyPermission();
    const p = points.find(x => x.id === id);
    if(!p) return;
    p.state = "phase1";
    p.endTime = Date.now() + PHASE1_DURATION;
    p.alertPlaying = false;
    save();
    render();
  }

  function resetPoint(id){
    const p = points.find(x => x.id === id);
    if(!p) return;
    p.state = "idle";
    p.endTime = null;
    p.alertPlaying = false;
    save();
    render();
  }

  function adjustTime(id, ms){
    const p = points.find(x => x.id === id);
    if(!p || p.state === "idle" || p.endTime === null) return;
    p.endTime += ms;
    save();
    render();
  }

  function renamePoint(id, newName){
    const p = points.find(x => x.id === id);
    if(!p) return;
    p.name = newName;
    save();
    editingId = null;
    render(true);
  }

  function startEditName(id){
    editingId = id;
    render(true);

    const el = grid.querySelector(`.card[data-id="${id}"]`);
    if(!el) return;
    const input = el.querySelector('.name-edit-input');
    if(!input) return;

    input.focus();
    input.select();

    let settled = false;
    function commit(){
      if(settled) return;
      settled = true;
      const newName = input.value.trim() || (points.find(x => x.id === id)?.name || "");
      renamePoint(id, newName);
    }

    input.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){ e.preventDefault(); commit(); }
      if(e.key === "Escape"){ settled = true; editingId = null; render(true); }
    });
    input.addEventListener("blur", commit);
  }

  function syncPoint(p){
    const now = Date.now();
    let changed = false;

    if(p.state === "phase1" && p.endTime !== null && now >= p.endTime){
      p.state = "phase2";
      p.endTime = p.endTime + (p.phase2Duration || PHASE2_DURATION);
      p.alertPlaying = false;
      changed = true;
    }
    if(p.state === "phase2" && p.endTime !== null && now >= p.endTime){
      p.state = "phase1";
      p.endTime = p.endTime + PHASE1_DURATION;
      p.alertPlaying = false;
      changed = true;
    }
    return changed;
  }

  function fmt(ms){
    if(ms < 0) ms = 0;
    const totalSec = Math.ceil(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }

  const RADIUS = 68;
  const CIRC = 2 * Math.PI * RADIUS;

  function imageBoxHtml(p){
    if(p.hasImage && imageCache.has(p.id)){
      const src = imageCache.get(p.id);
      return `<div class="card-image-box has-image" data-role="imageBox">
           <img src="${src}" alt="Point Image" data-action="showimage" data-id="${p.id}" title="คลิกเพื่อขยายรูป" />
           <label class="btn-icon image-change-btn" title="เปลี่ยนรูปภาพ">
             📷
             <input type="file" class="card-file-input" data-id="${p.id}" accept="image/*" />
           </label>
         </div>`;
    }
    if(p.hasImage){
      // Known to have an image, still being fetched from IndexedDB
      return `<div class="card-image-box has-image" data-role="imageBox">
           <span class="image-loading-text">กำลังโหลดรูป...</span>
           <label class="btn-icon image-change-btn" title="เปลี่ยนรูปภาพ">
             📷
             <input type="file" class="card-file-input" data-id="${p.id}" accept="image/*" />
           </label>
         </div>`;
    }
    return `<div class="card-image-box" data-role="imageBox">
           <label class="upload-label">
             <span style="font-size:18px;">📷</span>
             <span>คลิกเพื่อเพิ่มรูปภาพจุด</span>
             <input type="file" class="card-file-input" data-id="${p.id}" accept="image/*" />
           </label>
         </div>`;
  }

  function fmtMinSec(ms){
    const totalSec = Math.round(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
  }

  function durationRowHtml(p){
    const dur = p.phase2Duration || PHASE2_DURATION;
    return `<div class="duration-row" data-role="durationRow">
      <span data-role="durationLabel">รอเกิด ${fmtMinSec(dur)}</span>
      <button class="btn-icon" data-action="edit-duration" data-id="${p.id}" title="แก้ไขเวลารอเกิด" aria-label="แก้ไขเวลารอเกิด">✎</button>
    </div>`;
  }

  function setPointDuration(id, ms){
    const p = points.find(x => x.id === id);
    if(!p) return;
    p.phase2Duration = ms;
    save();
    const el = grid.querySelector(`.card[data-id="${id}"]`);
    if(el){
      const row = el.querySelector('[data-role="durationRow"]');
      if(row) row.outerHTML = durationRowHtml(p);
    }
  }

  function commitDurationEdit(id){
    const el = grid.querySelector(`.card[data-id="${id}"]`);
    if(!el) return;
    const row = el.querySelector('[data-role="durationRow"]');
    if(!row) return;
    const minInput = row.querySelector('[data-role="durMin"]');
    const secInput = row.querySelector('[data-role="durSec"]');
    if(!minInput || !secInput) return; // already committed (row was replaced)
    const p = points.find(x => x.id === id);
    const fallback = (p && p.phase2Duration) || PHASE2_DURATION;
    let m = parseInt(minInput.value, 10); if(isNaN(m) || m < 0) m = 0;
    let s = parseInt(secInput.value, 10); if(isNaN(s) || s < 0) s = 0;
    let ms = (m * 60 + s) * 1000;
    if(ms < 1000) ms = fallback; // guard against 0:00 typo
    setPointDuration(id, ms);
  }

  function cancelDurationEdit(id){
    const el = grid.querySelector(`.card[data-id="${id}"]`);
    if(!el) return;
    const row = el.querySelector('[data-role="durationRow"]');
    if(!row) return;
    const p = points.find(x => x.id === id);
    if(!p) return;
    row.outerHTML = durationRowHtml(p);
  }

  function startEditDuration(id){
    const el = grid.querySelector(`.card[data-id="${id}"]`);
    if(!el) return;
    const row = el.querySelector('[data-role="durationRow"]');
    if(!row) return;
    const p = points.find(x => x.id === id);
    if(!p) return;
    const dur = p.phase2Duration || PHASE2_DURATION;
    const curMin = Math.floor(dur / 60000);
    const curSec = Math.floor((dur % 60000) / 1000);

    row.innerHTML = `
      <input type="number" class="dur-input" data-role="durMin" min="0" max="59" value="${curMin}" />
      <span class="colon">:</span>
      <input type="number" class="dur-input" data-role="durSec" min="0" max="59" value="${curSec}" />
      <button class="mini-confirm" data-action="save-duration" data-id="${id}" title="บันทึก">✓</button>
    `;
    const minInput = row.querySelector('[data-role="durMin"]');
    minInput.focus();
    minInput.select();

    row.querySelectorAll(".dur-input").forEach(inp => {
      inp.addEventListener("keydown", (e) => {
        if(e.key === "Enter"){ e.preventDefault(); commitDurationEdit(id); }
        else if(e.key === "Escape"){ e.preventDefault(); cancelDurationEdit(id); }
      });
    });
    row.addEventListener("focusout", () => {
      setTimeout(() => {
        if(!row.contains(document.activeElement)) commitDurationEdit(id);
      }, 0);
    });
  }

  function cardTemplate(p){
    const isEditing = p.id === editingId;
    const titleHtml = isEditing
      ? `<input type="text" class="name-edit-input" value="${escapeHtml(p.name)}" maxlength="40" />`
      : `<div class="point-name" data-role="nameText">${escapeHtml(p.name)}</div>`;

    return `
      <div class="corner-bl"></div>
      <div class="corner-br"></div>
      <div class="card-top">
        <div style="flex:1; min-width:0;">
          ${titleHtml}
          ${durationRowHtml(p)}
        </div>
        <div class="card-top-actions">
          <button class="btn-icon btn-edit" data-action="edit" data-id="${p.id}" title="แก้ไขชื่อ">✎</button>
          <button class="btn-icon btn-del" data-action="delete" data-id="${p.id}" title="ลบจุดนี้">✕</button>
        </div>
      </div>
      ${imageBoxHtml(p)}
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 160 160">
          <circle class="ring-track" cx="80" cy="80" r="${RADIUS}"></circle>
          <circle class="ring-progress" data-role="ring" cx="80" cy="80" r="${RADIUS}"
            stroke-dasharray="${CIRC}" stroke-dashoffset="0"></circle>
        </svg>
        <div class="ring-center">
          <div class="digits" data-role="digits">--:--</div>
          <div class="phase-label" data-role="phaselabel">รอเริ่ม</div>
        </div>
      </div>
      <div class="status-line" data-role="status">&nbsp;</div>
      <div class="card-actions" data-role="actions"></div>
    `;
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  let renderedIds = [];

  function render(forceRebuild = false){
    const currentIds = points.map(p => p.id);
    const structureChanged = forceRebuild || currentIds.length !== renderedIds.length ||
      currentIds.some((id, i) => id !== renderedIds[i]);

    if(points.length === 0){
      grid.innerHTML = `<div class="empty-state">
        <span class="big">ยังไม่มีจุดจับเวลา</span>
        พิมพ์ชื่อจุดด้านบน แล้วกด "+ เพิ่มจุด" ได้เลย
      </div>`;
      renderedIds = [];
      return;
    }

    if(structureChanged){
      grid.innerHTML = "";
      points.forEach(p => {
        const el = document.createElement("div");
        el.className = "card";
        el.dataset.id = p.id;
        el.innerHTML = cardTemplate(p);
        grid.appendChild(el);
      });
      renderedIds = currentIds;
    }

    points.forEach(p => {
      updateCard(p);
      ensureImageLoaded(p);
    });
  }

  // Lazily fetch any image that's flagged as present but not yet in memory,
  // then patch just that card's image box in place once it arrives.
  function ensureImageLoaded(p){
    if(!p.hasImage || imageCache.has(p.id)) return;
    idbGetImage(p.id).then(dataUrl => {
      if(!dataUrl) return;
      imageCache.set(p.id, dataUrl);
      const box = grid.querySelector(`.card[data-id="${p.id}"] [data-role="imageBox"]`);
      if(box) box.outerHTML = imageBoxHtml(p);
    });
  }

  function updateCard(p){
    const el = grid.querySelector(`.card[data-id="${p.id}"]`);
    if(!el) return;

    const digitsEl = el.querySelector('[data-role="digits"]');
    const phaseLabelEl = el.querySelector('[data-role="phaselabel"]');
    const statusEl = el.querySelector('[data-role="status"]');
    const ringEl = el.querySelector('[data-role="ring"]');
    const actionsEl = el.querySelector('[data-role="actions"]');

    const now = Date.now();
    let remaining, total, ringColor, phaseText, statusText = "";

    if(p.state === "phase1"){
      remaining = Math.max(0, p.endTime - now);
      total = PHASE1_DURATION;
      ringColor = "var(--p1)";
      phaseText = "เฟส 1 · คูลดาวน์";
      statusText = "กำลังนับเวลาคูลดาวน์...";
      el.classList.remove("alerting");
    } else if(p.state === "phase2"){
      remaining = Math.max(0, p.endTime - now);
      total = p.phase2Duration || PHASE2_DURATION;
      const inAlert = remaining <= ALERT_THRESHOLD;
      ringColor = inAlert ? "var(--alert)" : "var(--p2)";
      phaseText = "เฟส 2 · สแตนด์บาย";
      statusText = inAlert ? "ไปรอที่จุดจกได้เลย!" : "รอหุ่นเกิดใหม่...";

      if(inAlert){
        el.classList.add("alerting");
        if(!p.alertPlaying){
          p.alertPlaying = true;
          playAlertPulse();
          notifyAlert(p.name);
          showToast(p.name);
        }
      } else {
        el.classList.remove("alerting");
        p.alertPlaying = false;
      }
    } else {
      remaining = PHASE1_DURATION;
      total = PHASE1_DURATION;
      ringColor = "var(--muted-2)";
      phaseText = "รอเริ่ม";
      statusText = "กดเริ่มเพื่อรัน Auto Loop";
      el.classList.remove("alerting");
      p.alertPlaying = false;
    }

    el.dataset.state = p.state;
    digitsEl.textContent = fmt(remaining);
    phaseLabelEl.textContent = phaseText;
    statusEl.textContent = statusText;

    const frac = total > 0 ? Math.min(1, Math.max(0, remaining / total)) : 0;
    const offset = p.state === "idle" ? CIRC : CIRC * (1 - frac);
    ringEl.style.stroke = ringColor;
    ringEl.style.strokeDashoffset = offset;

    if(p.state === "idle"){
      actionsEl.innerHTML = `<button class="btn btn-start" data-action="start" data-id="${p.id}">เริ่มจับเวลา</button>`;
    } else {
      actionsEl.innerHTML = `
        <div class="time-adjust-bar">
          <button class="btn-adj" data-action="adjust" data-ms="-30000" data-id="${p.id}" title="ลด 30 วิ">-30s</button>
          <button class="btn-adj" data-action="adjust" data-ms="-10000" data-id="${p.id}" title="ลด 10 วิ">-10s</button>
          <button class="btn-adj" data-action="adjust" data-ms="10000" data-id="${p.id}" title="เพิ่ม 10 วิ">+10s</button>
          <button class="btn-adj" data-action="adjust" data-ms="30000" data-id="${p.id}" title="เพิ่ม 30 วิ">+30s</button>
        </div>
        <button class="btn btn-reset" data-action="reset" data-id="${p.id}">หยุด / รีเซ็ต</button>
      `;
    }
  }

  function showImageModal(id){
    const p = points.find(x => x.id === id);
    if(!p || !p.hasImage) return;
    const src = imageCache.get(id);
    if(!src) return; // still loading from IndexedDB
    modalImg.src = src;
    modalTitle.textContent = p.name;
    modal.classList.add("active");
  }

  function hideImageModal(){
    modal.classList.remove("active");
    modalImg.src = "";
  }

  closeModalBtn.addEventListener("click", hideImageModal);
  modal.addEventListener("click", (e) => {
    if(e.target === modal) hideImageModal();
  });

  // จัดการอัปโหลดรูปผ่านช่องในการ์ดแต่ละใบ (บีบอัดก่อนเก็บลง IndexedDB)
  grid.addEventListener("change", (e) => {
    if(e.target.classList.contains("card-file-input")){
      const file = e.target.files[0];
      const id = e.target.dataset.id;
      if(!file || !id) return;
      compressImage(file).then(dataUrl => {
        updatePointImage(id, dataUrl);
      }).catch(() => {
        alert("โหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง");
      });
    }
  });

  grid.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if(!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    if(action === "start") startPoint(id);
    else if(action === "reset") resetPoint(id);
    else if(action === "delete") deletePoint(id);
    else if(action === "edit") startEditName(id);
    else if(action === "edit-duration") startEditDuration(id);
    else if(action === "save-duration") commitDurationEdit(id);
    else if(action === "showimage") showImageModal(id);
    else if(action === "adjust"){
      const ms = parseInt(btn.dataset.ms, 10);
      adjustTime(id, ms);
    }
  });

  addBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    if(!name) { nameInput.focus(); return; }
    let mins = parseInt(phase2MinInput.value, 10);
    let secs = parseInt(phase2SecInput.value, 10);
    if(isNaN(mins) || mins < 0) mins = 0;
    if(isNaN(secs) || secs < 0) secs = 0;
    let phase2Ms = (mins * 60 + secs) * 1000;
    if(phase2Ms < 1000) phase2Ms = PHASE2_DURATION; // guard against 0:00 typo
    ensureAudio();
    ensureNotifyPermission();
    addPoint(name, phase2Ms);
    nameInput.value = "";
    nameInput.focus();
  });
  nameInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter") addBtn.click();
  });

  function updateTabTitle(){
    const now = Date.now();
    let soonest = null;
    points.forEach(p => {
      if((p.state === "phase1" || p.state === "phase2") && p.endTime !== null){
        const remaining = p.endTime - now;
        if(soonest === null || remaining < soonest.remaining){
          soonest = { remaining, name: p.name };
        }
      }
    });
    if(soonest === null){
      document.title = DEFAULT_TITLE;
    } else {
      document.title = `${fmt(Math.max(0, soonest.remaining))} · ${soonest.name}`;
    }
  }

  function tick(){
    let needSave = false;
    points.forEach(p => { while(syncPoint(p)){ needSave = true; } });
    if(needSave) save();
    render();
    updateTabTitle();
  }

  async function init(){
    load();
    await migrateOldInlineImages();
    points.forEach(p => { while(syncPoint(p)){} });
    render(true);
    updateTabTitle();
    setInterval(tick, 1000);
  }
  init();

})();
</script>
</body>
</html>
